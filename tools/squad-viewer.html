<!doctype html>
<!-- Dev tool: checks the squad rig (game/rig.js) — every role, clip, LOD and kit, plus the prop models. Not part of the game UI. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Squad rig viewer</title>
<style>
  html, body { margin: 0; height: 100%; background: #20242b; color: #e8eaed; font: 14px/1.4 system-ui, sans-serif; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  .bar { position: fixed; left: 12px; top: 12px; right: 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .bar select, .bar button { background: #2f3540; color: inherit; border: 1px solid #4a5260; border-radius: 6px; padding: 8px 10px; font: inherit; }
  .bar button { cursor: pointer; }
  .bar button[aria-pressed="true"] { background: #3d6fd6; border-color: #3d6fd6; }
  .bar :focus-visible { outline: 2px solid #9cc0ff; outline-offset: 2px; }
  .info { position: fixed; left: 12px; bottom: 12px; color: #b5bac3; margin: 0; }
</style>
<script type="importmap">{ "imports": { "three": "../vendor/three/three.module.min.js", "three/addons/": "../vendor/three/addons/" } }</script>
</head>
<body>
<div class="bar">
  <label>Role <select id="role"><option>batter</option><option>bowler</option><option>fielder</option><option>keeper</option><option>umpire</option></select></label>
  <label>Clip <select id="clip"></select></label>
  <label>LOD <select id="lod"><option value="0">0</option><option value="1">1</option><option value="2">2</option></select></label>
  <label>Kit <select id="kit"><option>blue</option><option>green</option><option>whites</option><option>umpire</option></select></label>
  <button id="pause" aria-pressed="false">Pause</button>
</div>
<p class="info" id="info">Loading…</p>
<script type="module">
import * as THREE from "three";
import { loadRig, KITS } from "../game/rig.js";

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color("#20242b");
const camera = new THREE.PerspectiveCamera(40, 1, 0.05, 200);
scene.add(new THREE.HemisphereLight("#dfe8ff", "#3a4a2a", 1.4));
const sun = new THREE.DirectionalLight("#ffffff", 2.2);
sun.position.set(-3, 6, 4);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, { left: -6, right: 6, top: 6, bottom: -6 });
scene.add(sun);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.MeshStandardMaterial({ color: "#6b7d4f" }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);
const strip = new THREE.Mesh(new THREE.PlaneGeometry(3.05, 22), new THREE.MeshStandardMaterial({ color: "#cbb98d" }));
strip.rotation.x = -Math.PI / 2;
strip.position.set(0, 0.002, 9);
strip.receiveShadow = true;
scene.add(strip);

const rig = await loadRig();
const wicket = new THREE.Group();
wicket.add(rig.props.stumps.clone(), rig.props.bails.clone());
wicket.position.set(-0.1, 0, -1.25);
wicket.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.material = o.material.clone(); o.material.map = rig.kitTexture(KITS.blue); } });
scene.add(wicket);

const GROUPS = { batter: ["batting"], bowler: ["bowling"], fielder: ["fielding"], keeper: ["fielding"], umpire: ["umpire"] };
const ui = { role: document.getElementById("role"), clip: document.getElementById("clip"), lod: document.getElementById("lod"), kit: document.getElementById("kit") };
let player = null, paused = false;
const clock = new THREE.Clock();

async function setRole(role) {
  if (player) scene.remove(player.root);
  const kitName = role === "umpire" ? "umpire" : ui.kit.value === "umpire" ? "blue" : ui.kit.value;
  ui.kit.value = kitName;
  player = await rig.createPlayer(role, { kit: KITS[kitName], lod: Number(ui.lod.value) });
  scene.add(player.root);
  const names = Object.entries(rig.manifest.clips).filter(([, c]) => GROUPS[role].includes(c.group) &&
    (role !== "keeper" || c.outfit === "keeper") && (role !== "fielder" || c.outfit !== "keeper")).map(([n]) => n);
  ui.clip.innerHTML = names.map((n) => `<option>${n}</option>`).join("");
  wicket.visible = role === "batter" || role === "keeper";
  play(names[0]);
}
function play(name) {
  player.play(name, { fade: 0, loop: true });
  player.ball.visible = player.role === "bowler" || /throw|catch|take/.test(name);
  const c = rig.manifest.clips[name];
  const tris = player.lods[Number(ui.lod.value)].geometry.index.count / 3;
  document.getElementById("info").textContent =
    `${player.role} · ${name} ${c.duration}s${c.loop ? " (loop)" : ""} · events ${JSON.stringify(c.events)} · LOD${ui.lod.value} ${tris} tris · drag to orbit, wheel to zoom`;
}
ui.role.addEventListener("change", () => setRole(ui.role.value));
ui.clip.addEventListener("change", () => play(ui.clip.value));
ui.lod.addEventListener("change", () => { player.setLod(Number(ui.lod.value)); play(ui.clip.value); });
ui.kit.addEventListener("change", () => player.setKit(KITS[ui.kit.value]));
document.getElementById("pause").addEventListener("click", (e) => { paused = !paused; e.currentTarget.setAttribute("aria-pressed", String(paused)); });
await setRole("batter");

let yaw = -0.9, pitch = 0.2, dist = 4.5, drag = null;
const el = renderer.domElement;
el.addEventListener("pointerdown", (e) => { drag = { x: e.clientX, y: e.clientY }; el.setPointerCapture(e.pointerId); });
el.addEventListener("pointermove", (e) => {
  if (!drag) return;
  yaw -= (e.clientX - drag.x) * 0.008;
  pitch = Math.min(1.3, Math.max(-0.1, pitch + (e.clientY - drag.y) * 0.006));
  drag = { x: e.clientX, y: e.clientY };
});
el.addEventListener("pointerup", () => { drag = null; });
el.addEventListener("wheel", (e) => { dist = Math.min(20, Math.max(1.5, dist + e.deltaY * 0.004)); }, { passive: true });

const focus = new THREE.Vector3();
function frame() {
  const w = innerWidth, h = innerHeight;
  if (el.width !== Math.floor(w * renderer.getPixelRatio())) { renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
  const dt = clock.getDelta();
  if (player && !paused) player.update(dt);
  if (player) { player.bones.hips.getWorldPosition(focus); focus.y = 0.95; }
  camera.position.set(focus.x + Math.sin(yaw) * Math.cos(pitch) * dist, focus.y + Math.sin(pitch) * dist, focus.z + Math.cos(yaw) * Math.cos(pitch) * dist);
  camera.lookAt(focus);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
frame();
window.__viewer = { rig, get player() { return player; }, setRole, play, ui };
</script>
</body>
</html>
